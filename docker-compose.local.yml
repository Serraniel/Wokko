name: wokko

services:
  db:
    image: postgres:16-alpine
    container_name: wokko-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wokko
      POSTGRES_USER: wokko
      POSTGRES_PASSWORD: wokko_dev
    volumes:
      - wokko-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wokko"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wokko-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wokko:wokko_dev@db:5432/wokko?sslmode=disable
      JWT_SECRET: dev-jwt-secret-not-for-production
      UPLOAD_PATH: /data/uploads
      PORT: 8080
      PUBLIC_URL: http://localhost:3002
      ALLOW_PUBLIC_RECIPES: "true"
      OPEN_REGISTRATION: "false"
      RP_ID: localhost
      RP_ORIGIN: http://localhost:3002
      RP_DISPLAY_NAME: Wokko
    volumes:
      - wokko-uploads:/data/uploads
    ports:
      - "127.0.0.1:8081:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wokko-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
      ORIGIN: http://localhost:3002
    ports:
      - "127.0.0.1:3002:3000"

volumes:
  wokko-db:
    name: wokko-db
  wokko-uploads:
    name: wokko-uploads
