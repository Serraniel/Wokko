version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["Infra"]

  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "daily"
    labels: ["Infra"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    labels: ["Infra"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    labels: ["Infra"]
