name: PR check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets the check be run by hand on any branch.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Generated code is up to date
        run: |
          make generate
          git diff --exit-code -- backend/internal/store/sqlcgen frontend/src/lib/api/types.gen.ts frontend/src/lib/api/knowledge.gen.ts

      - name: Backend tests
        run: |
          go vet ./...
          go test ./...
        working-directory: backend

      - name: Frontend checks and tests
        run: |
          npm run check
          npm test
        working-directory: frontend

      - name: Browser flows
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: make e2e

      - name: Example compose file is valid
        run: docker compose -f docker-compose.example.yml config --quiet

      - name: Container image builds
        run: docker build .
