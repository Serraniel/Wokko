name: Release

# Conventional Commits on main decide the next version (fix: patch, feat: minor before 1.0).
# release-please keeps a release PR open with the version and changelog. Merging it tags the
# release, which then publishes the image and attaches SBOMs and licenses to the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # Releases and tags use the default token, so a tag never starts the publish workflow
      # a second time.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      # The release PR uses WOKKO_BOT_TOKEN when it's set (see catalog-refresh.yml), so its
      # CI starts by itself instead of waiting for someone to approve the run.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.WOKKO_BOT_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # A tag pushed by this workflow's own token doesn't start other workflows, so the image is
  # published from here.
  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
