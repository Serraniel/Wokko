name: Release

# Conventional Commits on main decide the next version (fix: patch, feat: minor before 1.0).
# release-please keeps a release PR open with the version and changelog. Merging it tags the
# release, which then publishes the image and attaches SBOMs and licenses to the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.prs_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Checks for the release PR, which wouldn't run by themselves. Starting a workflow by hand is
  # the one thing this token may do that starts another workflow.
  check-release-pr:
    needs: release-please
    if: needs.release-please.outputs.pr == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pr-check.yml --repo "$GITHUB_REPOSITORY" --ref release-please--branches--main
        env:
          GH_TOKEN: ${{ github.token }}

  # A tag pushed by this workflow's own token doesn't start other workflows, so the image is
  # published from here.
  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
